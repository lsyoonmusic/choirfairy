name: Build Choir Fairy VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64)
        shell: pwsh
        run: |
          $src = if (Test-Path "CMakeLists.txt") { "." } elseif (Test-Path "ChoirFairy-VST3/CMakeLists.txt") { "ChoirFairy-VST3" } else { throw "CMakeLists.txt not found." }
          Write-Host "Using source directory: $src"
          cmake -S $src -B build -A x64

      - name: Build VST3 Only (Release, Fast)
        run: cmake --build build --config Release --target ChoirFairy_VST3 --parallel

      - name: Upload Windows VST3 Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ChoirFairy-Windows-VST3
          path: build/ChoirFairy_artefacts/Release/VST3/
          if-no-files-found: error
